<!DOCTYPE html>
<html lang="en">
        
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>VITALAB</title>
            <link rel="stylesheet" href="styleVitalab.css">
            <link rel="icon" href="icons/VitaLabCla.ico">
    </head>
        
    <body> 
        <div class="Menu">
            <img src="images/Menu.png" alt="Icono menu" width="45px">
            <img src="images/Close.png" alt="Icono menu" width="45px">
        </div>
            <div class="barra_lateral">
                <div class="titulo_menu"> 
                    <img id="Logo" src="images/VitaLabCla.png" alt="Logo de VitaLab">
                    <span>Vitalab</span>
                </div>
                <button class="boton">
                    <img src="images/plus.png" alt="Simbolo mas"  width="20">
                    <span> Create new</span>
                </button>

                <nav class="navegacion"> 
                    <ul>
                        <br>
                        <li>
                            <a href="#PrimerContenido" id="PrimerBoton">
                                <img src="images/Mail.png" alt="logo de gmail" width="20">
                                <span> Dashboard </span>
                            </a>
                        </li>
                            
                        <li>
                            <a href="#SegundoContenido" id="SegundoBoton">
                                <img src="images/Mail.png" alt="logo de gmail" width="20">
                                <span> 2 </span>
                            </a>
                        </li>
                        
                        <li>
                            <a href="#TercerContenido" id="TercerBoton">
                                <img src="images/Mail.png" alt="logo de gmail" width="20">
                                <span> 3 </span>
                            </a>
                        </li>

                        <li>
                            <a href="#CuartoContenido" id="CuartoBoton">
                                <img src="images/Mail.png" alt="logo de gmail" width="20">
                                <span> 4 </span>
                            </a>
                        </li>

                        <li>
                            <a href="#QuintoContenido" id="QuintoBoton">
                                <img src="images/Mail.png" alt="logo de gmail" width="20">
                                <span> 5 </span>
                            </a>
                        </li>

                        <li>
                            <a href="#SextaContenido" id="SextoBoton">
                                <img src="images/Mail.png" alt="logo de gmail" width="20">
                                <span> 6 </span>
                            </a>
                        </li>

                        <li>
                            <a href="#SeptimaContenido" id="SeptimoBoton">
                                <img src="images/Mail.png" alt="logo de gmail" width="20">
                                <span> 7 </span>
                            </a>
                        </li>
                    </ul>
                </nav>

                <div class="linea"></div>

                <div class="modo_oscuro">
                    <div class="info">
                        <img src="images/Oscuro.png" alt="Icono modo oscuro" width="25">
                        <span> Dark mode</span>
                    </div>

                    <div class="switch">
                        <div class="base">
                            <div class="circulo"></div>
                        </div>
                    </div>
                </div>

                <div class="usuario">
                    <img src="images/Usuario.png" alt="icono usuario" width="20">
                    <div class="info_usuario">
                        <div class="nombre_email">
                            <span class="nombre"> Andy </span>
                            <span class="email"> Andy@gmail.com  </span>
                        </div>
                        <img src="images/ellipsis.png" alt="ellipsis">
                    </div>
                </div>
            </div>  

        <main>

            <section id="PrimerContenido" class="PrimeraSeccion">
                <h1> VITALAB </h1>
                <p>Sección del Dashboard.</p>
            </section>

            <section id="SegundoContenido" class="SegundaSeccion">
                <h1> VITALAB </h1>
                <p>Segunda Sección.</p>
            </section>

            <section id="TercerContenido" class="TercerSeccion">
                <h1> VITALAB </h1>
                <p>Tercera Sección.</p>
            </section>

            <section id="CuartoContenido" class="CuartaSeccion">
                <h1> VITALAB </h1>
                <p>Cuarta Sección.</p>
            </section>

            <section id="QuintoContenido" class="QuintaSeccion">
                <h1> VITALAB </h1>
                <p>Quinta Sección.</p>
            </section>

            <section id="SextaContenido" class="SextaSeccion">
                <h1> VITALAB </h1>
                <p>Sexta Sección.</p>
            </section>

            <section id="SeptimaContenido" class="SeptimaSeccion">
                <h1> VITALAB </h1>
                <p>Septima Sección.</p>
            </section>

            <section>
                <div class="wave wave1"></div>
                <div class="wave wave2"></div>
                <div class="wave wave3"></div>
                <div class="wave wave4"></div>
            </section>  

        </main>

        <script src="scriptVitalab.js"></script>
    </body>
</html>
